<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="45%" stop-color="#0B192C" />
      <stop offset="80%" stop-color="#172554" />
      <stop offset="100%" stop-color="#854D0E" />
    </linearGradient>

    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="50%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>

    <linearGradient id="waveLayer1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0.30" />
    </linearGradient>

    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#050811" stop-opacity="0" />
    </radialGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  
  <rect width="1200" height="300" rx="16" fill="url(#bgGrad)" />

  
  <g stroke="#F8FAFC" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="200" y1="0" x2="200" y2="300" />
    <line x1="400" y1="0" x2="400" y2="300" />
    <line x1="600" y1="0" x2="600" y2="300" />
    <line x1="800" y1="0" x2="800" y2="300" />
    <line x1="1000" y1="0" x2="1000" y2="300" />
  </g>

  
  <circle cx="600" cy="135" r="240" fill="url(#coreGlow)">
    <animate attributeName="r" values="210;260;210" dur="5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.7;1;0.7" dur="5s" repeatCount="indefinite" />
  </circle>

  
  <path fill="url(#waveLayer1)">
    <animate attributeName="d" dur="8s" repeatCount="indefinite" values="
        M0,210 C300,150 450,270 750,210 C950,170 1100,230 1200,195 L1200,300 L0,300 Z;
        M0,225 C280,265 520,160 800,220 C1000,260 1120,180 1200,210 L1200,300 L0,300 Z;
        M0,210 C300,150 450,270 750,210 C950,170 1100,230 1200,195 L1200,300 L0,300 Z
      " />
  </path>

  
  <path fill="#0D1117" fill-opacity="0.85">
    <animate attributeName="d" dur="6s" repeatCount="indefinite" values="
        M0,245 C250,280 500,200 780,245 C980,275 1100,225 1200,240 L1200,300 L0,300 Z;
        M0,230 C320,195 550,275 820,235 C1020,205 1120,260 1200,230 L1200,300 L0,300 Z;
        M0,245 C250,280 500,200 780,245 C980,275 1100,225 1200,240 L1200,300 L0,300 Z
      " />
  </path>

  
  <rect x="1" y="1" width="1198" height="298" rx="15" stroke="#D4AF37" stroke-opacity="0.4" stroke-width="1.5" />

  
  <text x="600" y="128" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="900" letter-spacing="6" fill="url(#goldText)" filter="url(#glow)">
    OPEN JARVIS ANDROID
    <animate attributeName="opacity" from="0" to="1" dur="1.2s" fill="freeze" />
  </text>

  
  <text x="600" y="172" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="500" letter-spacing="2.5" fill="#CBD5E1">
    AUTONOMOUS HYBRID EDGE &amp; CLOUD AI OPERATING LAYER
    <animate attributeName="opacity" from="0" to="1" dur="1.6s" fill="freeze" />
  </text>
</svg>
