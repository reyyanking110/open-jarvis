name: Android CI

on:
  push:
    branches: [ main, "arena/**", "feature/**" ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Unit Tests & Assemble Debug APK
        run: |
          set +e
          ./gradlew clean testDebugUnitTest assembleDebug --no-daemon --console=plain > gradle.log 2>&1
          EXIT_CODE=$?
          cat gradle.log
          if [ $EXIT_CODE -ne 0 ]; then
            python3 - <<'PY'
          with open("gradle.log", "r", errors="replace") as f:
              lines = [l.rstrip() for l in f]
          cut = next((i for i, l in enumerate(lines) if "FAILURE: Build failed" in l), len(lines))
          pre = [l for l in lines[:cut] if l.strip()]
          err_lines = [l for l in pre if any(k in l for k in ("e: ", "[ksp]", "error:", "Exception", "Hilt", "Room", "Ksp"))]
          chosen = err_lines[:8] if err_lines else pre[-8:]
          for l in chosen:
              print("::error::" + l[:300].replace("%", "%25").replace("\r", "").replace("\n", " "))
          PY
            exit $EXIT_CODE
          fi
          python3 - <<'PY'
          import glob, os, xml.etree.ElementTree as ET
          total = failed = skipped = 0
          for p in sorted(glob.glob("app/build/test-results/testDebugUnitTest/TEST-*.xml")):
              root = ET.parse(p).getroot()
              t = int(root.attrib.get("tests", 0))
              f = int(root.attrib.get("failures", 0)) + int(root.attrib.get("errors", 0))
              s = int(root.attrib.get("skipped", 0))
              total += t; failed += f; skipped += s
              print(f"::notice::Suite {root.attrib.get('name')}: {t} tests, {f} failed, {s} skipped")
          apks = glob.glob("app/build/outputs/apk/debug/*.apk")
          apk_info = ", ".join(f"{os.path.basename(a)} ({os.path.getsize(a)//1024} KB)" for a in apks)
          print(f"::notice::TOTAL TESTS: {total} passed={total-failed-skipped} failed={failed} skipped={skipped} | APK: {apk_info}")
          PY
