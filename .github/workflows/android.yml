name: Android CI

on:
  push:
    branches: [ main, "arena/**", "feature/**" ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Unit Tests & Assemble Debug APK
        run: ./gradlew clean testDebugUnitTest assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: open-jarvis-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
